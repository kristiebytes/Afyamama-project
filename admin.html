<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AfyaMama Admin Dashboard</title>
    <style>
        /* WARM TONE PALETTE: Uniform Earth-Tones */
        :root { 
            --primary: #a16207;      /* Warm Amber */
            --secondary: #d97706;    /* Warm Orange */
            --bg-page: #fffbeb;      /* Cream Sand */
            --sidebar: #78350f;      /* Deep Earth Brown */
            --accent: #f59e0b;       /* Soft Highlight */
            --white: #ffffff;
            --text-dark: #451a03;    /* Chocolate Brown */
        }

        body { display: flex; margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-page); color: var(--text-dark); }
        
        /* Sidebar: Consistent Brown */
        .sidebar { width: 250px; background: var(--sidebar); color: var(--white); height: 100vh; padding: 20px; }
        .sidebar h2 { font-size: 1.5rem; margin-bottom: 30px; color: var(--accent); }
        .sidebar button { display: block; width: 100%; padding: 15px; margin: 10px 0; background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 8px; text-align: left; font-weight: bold; transition: 0.3s; }
        .sidebar button:hover { background: var(--secondary); }
        
        /* Content & Pages */
        .content { flex: 1; padding: 40px; }
        .page { display: none; background: var(--white); padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .page.active { display: block; }
        
        /* Reports Grid */
        .report-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .report-card { background: #fff7ed; padding: 20px; border-radius: 10px; border-left: 5px solid var(--primary); cursor: pointer; transition: 0.2s; }
        .report-card:hover { background: #fee2e2; }

        /* User Icons */
        .card-group { display: flex; gap: 40px; justify-content: center; margin-top: 40px; }
        .icon-box { width: 150px; height: 150px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 70px; border: 3px solid var(--primary); background: #fef3c7; }

        /* Buttons & Tables */
        button { cursor: pointer; border-radius: 8px; border: none; padding: 10px 20px; background: var(--primary); color: white; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--primary); color: white; padding: 12px; }
        td { padding: 12px; border: 1px solid #fde68a; }
        
        /* Profile Fields */
        .profile-container { max-width: 400px; }
        .profile-container label { display: block; margin-top: 15px; font-weight: bold; }
        .profile-container input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--primary); border-radius: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>AfyaMama Admin</h2>
        <button onclick="showPage('reports')">📊 Reports</button>
        <button onclick="showPage('users')">👥 Users</button>
        <button onclick="showPage('profile')">👤 Profile</button>
    </div>

    <div class="content">
        <div id="reports" class="page active">
            <h1>System Reports Overview</h1>
            <div class="report-grid">
                <div class="report-card" onclick="showReportDetails('Maternal')"><h3>📄 Maternal Health</h3></div>
                <div class="report-card" onclick="showReportDetails('Child')"><h3>📄 Child Health</h3></div>
                <div class="report-card" onclick="showReportDetails('Immunization')"><h3>📄 Immunization</h3></div>
                <div class="report-card" onclick="showReportDetails('Appointments')"><h3>📄 Appointments</h3></div>
            </div>
            <div id="report-details" style="display:none; margin-top:20px;">
                <button onclick="backToReports()">← Back</button>
                <h2 id="report-title">Report Detail</h2>
                <div id="report-content"></div>
            </div>
        </div>

        <div id="users" class="page">
            <h1>User Management</h1>
            <div id="user-selection" class="card-group">
                <div onclick="displayTable('mother')" style="text-align:center; cursor:pointer;">
                    <div class="icon-box">👩‍🍼</div>
                    <h2 style="color:var(--primary);">MOTHERS</h2>
                </div>
                <div onclick="displayTable('doctor')" style="text-align:center; cursor:pointer;">
                    <div class="icon-box">👨‍⚕️</div>
                    <h2 style="color:var(--primary);">DOCTORS</h2>
                </div>
            </div>
            <div id="user-list-view" style="display:none;">
                <button onclick="backToSelection()">← Back</button>
                <h2 id="table-title">User List</h2>
                <table><thead><tr><th>Name</th><th>Email</th></tr></thead><tbody id="user-table-body"></tbody></table>
            </div>
        </div>

        <div id="profile" class="page">
            <h1>My Profile</h1>
            <div class="profile-container">
                <div style="font-size: 50px;">👤</div>
                <form>
                    <label>First Name</label><input type="text" value="Leslie" disabled>
                    <label>Last Name</label><input type="text" value="Cooper" disabled>
                    <label>Email</label><input type="email" value="example@gmail.com" disabled>
                    <label>Phone</label><input type="text" value="+0123-456-789" disabled>
                    <label>Gender</label><input type="text" value="Female" disabled>
                    <br><br><button type="button">Update Changes</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyDdkxqgxqInhIG-L0v7H_LJeqjAEap4B1s",
            projectId: "afyamama-5cbaf"
        }));

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        window.showReportDetails = (type) => {
            document.querySelector('.report-grid').style.display = 'none';
            document.getElementById('report-details').style.display = 'block';
            document.getElementById('report-title').innerText = type + " Health Detailed Report";
        };

        window.backToReports = () => {
            document.querySelector('.report-grid').style.display = 'grid';
            document.getElementById('report-details').style.display = 'none';
        };

        window.displayTable = async (role) => {
            document.getElementById('user-selection').style.display = 'none';
            document.getElementById('user-list-view').style.display = 'block';
            document.getElementById('table-title').innerText = role.toUpperCase() + ' LIST';
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '<tr><td colspan="2">Loading...</td></tr>';
            const q = query(collection(db, "Users"), where("role", "==", role));
            const snapshot = await getDocs(q);
            tbody.innerHTML = '';
            snapshot.forEach(doc => {
                tbody.innerHTML += `<tr><td>${doc.data().name}</td><td>${doc.data().email}</td></tr>`;
            });
        };

        window.backToSelection = () => {
            document.getElementById('user-selection').style.display = 'flex';
            document.getElementById('user-list-view').style.display = 'none';
        };
    </script>
</body>
</html>
