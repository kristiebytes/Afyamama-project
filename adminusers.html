<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management - AfyaMama</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-purple: #55075c; --sidebar-bg: #55075c; --active-pink: #c9227a; --bg-light: #f5f6f8; --white: #ffffff; --text-heading: #55075c; --text-muted: #736275; --text-dark: #201021; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { display: flex; background: var(--bg-light); color: var(--text-dark); min-height: 100vh; }

        /* Sidebar - Uniform Dashboard Style */
        .sidebar { width: 260px; height: 100vh; background: var(--sidebar-bg); color: white; padding: 24px 16px; position: fixed; box-shadow: 4px 0 10px rgba(0,0,0,0.05); }
        .logo { text-align: center; margin-bottom: 30px; font-weight: 600; font-size: 1.25rem; }
        .sidebar ul { list-style: none; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .sidebar li { padding: 12px 16px; cursor: pointer; border-radius: 8px; font-weight: 500; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .sidebar li a { color: rgba(255, 255, 255, 0.85); text-decoration: none; width: 100%; }
        .sidebar li.active { background: var(--active-pink); }
        .sidebar li::before { font-family: "Font Awesome 6 Free"; font-weight: 900; width: 24px; }
        .sidebar li:nth-child(1)::before { content: "\f200"; }
        .sidebar li:nth-child(2)::before { content: "\f500"; }
        .sidebar li:nth-child(3)::before { content: "\f56d"; }
        .sidebar li:nth-child(4)::before { content: "\f0f3"; }
        .sidebar li:nth-child(5)::before { content: "\f007"; }
        #logoutBtn { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); border-radius: 0; }
        #logoutBtn::before { content: "\f2f5"; }

        /* Content Area */
        .main-content { flex: 1; padding: 40px; margin-left: 260px; }
        .page-container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(85, 7, 92, 0.05); }
        h1 { color: var(--text-heading); margin-bottom: 30px; }

        /* Cards & Table */
        .card-group { display: flex; gap: 30px; justify-content: center; }
        .role-card { width: 200px; padding: 30px; border: 2px solid var(--primary-purple); border-radius: 15px; cursor: pointer; text-align: center; background: #faf8fb; transition: 0.3s; }
        .role-card:hover { background: #f0e6f2; transform: translateY(-5px); border-color: var(--active-pink); }
        .icon { font-size: 50px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--primary-purple); color: white; padding: 12px; }
        td { padding: 12px; border: 1px solid #ebd6ed; text-align: center; }
        .btn-back { background: #736275; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">AfyaMama Admin</div>
        <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li class="active"><a href="adminusers.html">Users</a></li>
            <li><a href="adminreport.html">Reports</a></li>
            <li><a href="adminnotification.html">Notifications</a></li>
            <li><a href="adminprofile.html">Profile</a></li>
            <li><a href="logout.html">Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="page-container">
            <div id="user-selection">
                <h1>User Management</h1>
                <div class="card-group">
                    <div class="role-card" onclick="displayTable('mother')">
                        <div class="icon">👩‍🍼</div>
                        <h3>Mothers</h3>
                    </div>
                    <div class="role-card" onclick="displayTable('doctor')">
                        <div class="icon">👨‍⚕️</div>
                        <h3>Doctors</h3>
                    </div>
                </div>
            </div>

            <div id="user-list-view" style="display:none;">
                <button class="btn-back" onclick="backToSelection()">← Back</button>
                <h2 id="table-title" style="color: var(--primary-purple); margin-top: 20px;">User List</h2>
                <table>
                    <thead><tr><th>Name</th><th>Email</th></tr></thead>
                    <tbody id="user-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function displayTable(role) {
            document.getElementById('user-selection').style.display = 'none';
            document.getElementById('user-list-view').style.display = 'block';
            document.getElementById('table-title').innerText = role.toUpperCase() + ' LIST';
        }
        function backToSelection() {
            document.getElementById('user-selection').style.display = 'block';
            document.getElementById('user-list-view').style.display = 'none';
        }
    </script>
</body>
</html>
