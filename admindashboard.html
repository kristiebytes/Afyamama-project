<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfyaMama Admin Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    /* Precise Color Scheme from the Image */
    --primary-purple: #55075c;
    --sidebar-bg: #55075c;
    --active-pink: #c9227a;
    --bg-light: #f5f6f8;
    --white: #ffffff;
    
    /* Text Color Rules */
    --text-heading: #55075c;
    --text-muted: #736275;
    --text-dark: #201021;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
    display: flex;
    background: var(--bg-light);
    color: var(--text-dark);
    min-height: 100vh;
}

/* --- Sidebar --- */
.sidebar {
    width: 260px;
    height: 100vh;
    background: var(--sidebar-bg);
    color: white;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0;
    top: 0;
    box-shadow: 4px 0 10px rgba(0,0,0,0.05);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Profile image frame matching your logo preview area */
.logo::before {
    content: '';
    display: block;
    width: 110px;
    height: 45px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    margin-bottom: 15px;
    background-image: url('logo.png'); /* Swap with your logo file path if needed */
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

.logo h2 {
    color: #ffffff;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.sidebar ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-grow: 1;
}

.sidebar li {
    padding: 12px 16px;
    cursor: pointer;
    border-radius: 8px;
    font-weight: 500;
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.85);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s ease;
}

/* Sidebar Item Icons Injector using CSS pseudo-elements */
.sidebar li::before {
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    font-size: 1.1rem;
    width: 24px;
}
.sidebar ul li:nth-child(1)::before { content: "\f200"; } /* Dashboard Icon */
.sidebar ul li:nth-child(2)::before { content: "\f500"; } /* Users Icon */
.sidebar ul li:nth-child(3)::before { content: "\f56d"; } /* Reports Icon */
.sidebar ul li:nth-child(4)::before { content: "\f0f3"; } /* Notifications Icon */
.sidebar ul li:nth-child(5)::before { content: "\f007"; } /* Profile Icon */
.sidebar ul li#logoutBtn::before { content: "\f2f5"; }    /* Logout Icon */

.sidebar li:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
}

.sidebar li.active {
    background: var(--active-pink);
    color: white;
    box-shadow: 0 4px 12px rgba(201, 34, 122, 0.25);
}

/* Push Logout elegantly to the absolute bottom section of the bar */
.sidebar li#logoutBtn {
    margin-top: auto;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 20px;
    border-radius: 0;
}

/* --- Main Content --- */
.main-content {
    flex: 1;
    padding: 40px;
    margin-left: 260px; /* Aligns with fixed sidebar footprint */
}

.main-content h2 {
    color: var(--text-heading);
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 30px;
}

/* --- Cards Grid --- */
.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
}

.card {
    background: var(--white);
    padding: 24px 30px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(85, 7, 92, 0.03);
    border: 1px solid #f0e6f2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(85, 7, 92, 0.06);
}

.card h3 {
    color: var(--text-muted);
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: none;
    margin-bottom: 8px;
    order: 1;
}

.card p {
    font-size: 2.25rem;
    font-weight: 700;
    color: var(--text-heading);
    order: 2;
}

/* Container text element layout rule */
.card {
    flex-direction: row;
}
.card-meta-wrap {
    display: flex;
    flex-direction: column;
}

/* Card Icons injection directly via CSS matching image alignments */
.card::after {
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    font-size: 2rem;
    color: #a38ea4; /* Subtle purple tint style for non-intrusive accentuation */
}
.cards .card:nth-child(1)::after { content: "\f53d"; } /* Breastfeeding */
.cards .card:nth-child(2)::after { content: "\f0f0"; } /* Doctor */
.cards .card:nth-child(3)::after { content: "\f77c"; } /* Baby */
.cards .card:nth-child(4)::after { content: "\f133"; } /* Calendar */
.cards .card:nth-child(5)::after { content: "\f48e"; } /* Syringe */
.cards .card:nth-child(6)::after { content: "\f1e0"; } /* Stethoscope */

/* Responsive breakpoints */
@media (max-width: 992px) {
    .cards { grid-template-columns: 1fr; }
}

/* Remove default link styling */
.sidebar a {
    text-decoration: none;
    color: inherit; /* This makes the link take the color of the parent li */
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
}
</style>

</head>

<body>

<div class="sidebar">


<div class="logo">
    <h2>AfyaMama Admin</h2>
</div>

<ul>
    <li><a href="admindashboard.html" class="active">Dashboard</a></li>
    <li><a href="adminusers.html">Users</a></li>
    <li><a href="adminreport.html">Reports</a></li>
    <li><a href="adminnotification.html">Notifications</a></li>
    <li><a href="adminprofile.html">Profile</a></li>
    <li id="logoutBtn"><a href="logout.html">Logout</a></li>
</ul>

</div>

<div class="main-content">

<h2>Welcome Admin</h2>

<div class="cards">

    <div class="card">
        <h3>Total Mothers</h3>
        <p id="motherCount">0</p>
    </div>

    <div class="card">
        <h3>Total Doctors</h3>
        <p id="doctorCount">0</p>
    </div>

    <div class="card">
        <h3>Total Children</h3>
        <p id="childrenCount">0</p>
    </div>

    <div class="card">
        <h3>ANC Visits</h3>
        <p id="ancCount">0</p>
    </div>

    <div class="card">
        <h3>Vaccines Given</h3>
        <p id="vaccineCount">0</p>
    </div>

    <div class="card">
        <h3>PNC Visits</h3>
        <p id="pncCount">0</p>
    </div>

</div>


</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
}
from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

const firebaseConfig = {

    apiKey: "AIzaSyDdkxqgxqInhIG-L0v7H_LJeqjAEap4B1s",
    projectId: "afyamama-5cbaf"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadDashboard(){

    try{

        const mothers = await getDocs(
            query(
                collection(db,"Users"),
                where("role","==","mother")
            )
        );

        document.getElementById("motherCount").innerText =
        mothers.size;

        const doctors = await getDocs(
            query(
                collection(db,"Users"),
                where("role","==","doctor")
            )
        );

        document.getElementById("doctorCount").innerText =
        doctors.size;

        const children =
        await getDocs(collection(db,"Children"));

        document.getElementById("childrenCount").innerText =
        children.size;

        const anc =
        await getDocs(collection(db,"ANC_Visits"));

        document.getElementById("ancCount").innerText =
        anc.size;

        const vaccines =
        await getDocs(collection(db,"Immunizations"));

        document.getElementById("vaccineCount").innerText =
        vaccines.size;

        const pnc =
        await getDocs(collection(db,"PNC_Visits"));

        document.getElementById("pncCount").innerText =
        pnc.size;

    }
    catch(error){

        console.error(error);

    }
}

loadDashboard();

document
.getElementById("logoutBtn")
.addEventListener("click",()=>{

    localStorage.clear();

    window.location.href =
    "admin-login.html";

});

</script>

</body>
</html>
