<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Wellness Notification - AfyaMama</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-purple: #55075c; --sidebar-bg: #55075c; --active-pink: #c9227a; --bg-light: #f5f6f8; --white: #ffffff; --text-heading: #55075c; --text-muted: #736275; --text-dark: #201021; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { display: flex; background: var(--bg-light); color: var(--text-dark); min-height: 100vh; }

        /* Sidebar - Uniform Design */
        .sidebar { width: 260px; height: 100vh; background: var(--sidebar-bg); color: white; padding: 24px 16px; position: fixed; box-shadow: 4px 0 10px rgba(0,0,0,0.05); }
        .logo { text-align: center; margin-bottom: 30px; font-weight: 600; font-size: 1.25rem; }
        .sidebar ul { list-style: none; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .sidebar li { padding: 12px 16px; cursor: pointer; border-radius: 8px; font-weight: 500; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .sidebar li a { color: rgba(255, 255, 255, 0.85); text-decoration: none; width: 100%; }
        .sidebar li.active { background: var(--active-pink); }
        .sidebar li::before { font-family: "Font Awesome 6 Free"; font-weight: 900; width: 24px; }
        .sidebar li:nth-child(1)::before { content: "\f200"; }
        .sidebar li:nth-child(2)::before { content: "\f500"; }
        .sidebar li:nth-child(3)::before { content: "\f56d"; }
        .sidebar li:nth-child(4)::before { content: "\f0f3"; }
        .sidebar li:nth-child(5)::before { content: "\f007"; }
        #logoutBtn { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); border-radius: 0; }
        #logoutBtn::before { content: "\f2f5"; }

        /* Main Layout */
        .main-content { flex: 1; padding: 40px; margin-left: 260px; }
        h1 { color: var(--text-heading); margin-bottom: 30px; }
        
        /* Card Style */
        .card { background: var(--white); padding: 30px; border-radius: 16px; border: 1px solid #f0e6f2; box-shadow: 0 4px 15px rgba(85, 7, 92, 0.03); max-width: 750px; margin-bottom: 30px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ebd6ed; border-radius: 10px; background: #faf8fb; margin-bottom: 20px; outline: none; }
        
        .btn-group { display: flex; gap: 12px; }
        button { padding: 12px 24px; border-radius: 25px; border: none; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:nth-child(1) { background: #ebd6ed; color: var(--primary-purple); }
        button:nth-child(2) { background: var(--primary-purple); color: white; }
        button:hover { opacity: 0.8; }

        .notification-card { background: white; padding: 20px; border-radius: 15px; border-left: 5px solid var(--primary-purple); margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">AfyaMama Admin</div>
    <ul>
            <li><a href="admindashboard.html">Dashboard</a></li>
            <li><a href="adminusers.html">Users</a></li>
            <li><a href="adminreport.html">Reports</a></li>
            <li class="active"><a href="adminnotification.html">Notifications</a></li>
            <li><a href="adminprofile.html">Profile</a></li>
            <li><a href="logout.html">Logout</a></li>
        </ul>
</div>

<div class="main-content">
    <h1>Create Wellness Notification</h1>

    <div class="card">
        <label>Notification Type</label>
        <select id="category">
            <option value="Prenatal">Prenatal Wellness</option>
            <option value="Postnatal">Postnatal Wellness</option>
        </select>
        <label>Title</label>
        <input type="text" id="title" placeholder="Enter title">
        <label>Wellness Message</label>
        <textarea id="message" rows="4" placeholder="Write wellness tip..."></textarea>
        <div class="btn-group">
            <button onclick="saveNotification()">Save Notification</button>
            <button onclick="sendNotification()">Send Notification</button>
        </div>
    </div>

    <h2>History</h2>
    <div id="notificationList"></div>
</div>

<script>
    let notifications = [];
    function saveNotification() {
        const title = document.getElementById("title").value;
        const msg = document.getElementById("message").value;
        if (!title || !msg) return alert("Fill all fields");
        notifications.push({ id: Date.now(), title, msg, date: new Date().toLocaleDateString() });
        render();
    }
    function render() {
        document.getElementById("notificationList").innerHTML = notifications.map(n => `
            <div class="notification-card">
                <strong>${n.title}</strong><br><small>${n.date}</small>
                <p>${n.msg}</p>
                <button onclick="notifications = notifications.filter(x=>x.id !== ${n.id}); render()">Delete</button>
            </div>
        `).join('');
    }
    function sendNotification() { alert("Sent!"); }
</script>

</body>
</html>
